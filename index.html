<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated Title & Open Graph Meta Tags for Professional WhatsApp Link Preview -->
    <title>Esha Jawaid | Creative UI/UX Developer & Frontend Specialist</title>
    <meta name="title" content="Esha Jawaid | Creative UI/UX Developer & Frontend Specialist">
    <meta property="og:title" content="Esha Jawaid | Creative UI/UX Developer & Frontend Specialist">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://esha-jawaid.vercel.app/">
    <meta property="og:description" content="Portfolio of Esha Jawaid - High-performance storefronts, corporate web portals, and scalable digital interfaces with precision engineering.">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Esha Jawaid | Creative UI/UX Developer & Frontend Specialist">

    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070714;
            --card-bg: #0d0f26;
            --card-border: rgba(139, 92, 246, 0.15);
            --accent-purple: #6366f1;
            --accent-blue: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glow: 0 0 25px rgba(99, 102, 241, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Header Navigation Bar */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .profile-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-box {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: #ffffff;
            box-shadow: var(--glow);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.2;
        }

        .brand-text span {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #818cf8;
            text-transform: uppercase;
        }

        .talk-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .talk-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        /* Bio Description Banner */
        .bio-description {
            text-align: center;
            color: #d1d5db;
            font-size: 14.5px;
            line-height: 1.6;
            margin: 8px 0 12px 0;
            padding: 0 8px;
        }

        /* Action Buttons Section (GitHub Removed) */
        .cta-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            align-items: center;
        }

        .btn-live {
            width: 85%;
            background: linear-gradient(135deg, #5b50f6 0%, #7c3aed 100%);
            color: white;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(91, 80, 246, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-live:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(91, 80, 246, 0.6);
        }

        /* Stats Grid (2x2 Layout) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            margin-top: 10px;
        }

        .stat-card {
            background: rgba(13, 15, 38, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-3px);
            background: rgba(17, 20, 50, 0.85);
        }

        .stat-val {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            line-height: 1.4;
        }

        .val-purple { color: #a5b4fc; }
        .val-light-purple { color: #c084fc; }
        .val-pink { color: #f472b6; }
        .val-green { color: #34d399; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header class="top-nav">
            <div class="profile-brand">
                <div class="avatar-box">EJ</div>
                <div class="brand-text">
                    <h1>Esha Jawaid</h1>
                    <span>Full-Stack Architect</span>
                </div>
            </div>
            <a href="https://wa.me/" class="talk-btn" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> Let's Talk
            </a>
        </header>

        <!-- Description -->
        <p class="bio-description">
            storefronts, corporate web portals, and scalable digital interfaces with precision engineering.
        </p>

        <!-- Action Buttons -->
        <div class="cta-section">
            <a href="#" class="btn-live">
                <i class="fa-solid fa-rocket"></i> View Live Deployments
            </a>
        </div>

        <!-- 2x2 Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-val val-purple">3.46</span>
                <span class="stat-label">Academic CGPA<br>(BS CS)</span>
            </div>
            <div class="stat-card">
                <span class="stat-val val-light-purple">100%</span>
                <span class="stat-label">Mobile & Speed<br>Optimized</span>
            </div>
            <div class="stat-card">
                <span class="stat-val val-pink">Live</span>
                <span class="stat-label">Production Web<br>Apps</span>
            </div>
            <div class="stat-card">
                <span class="stat-val val-green">Certified</span>
                <span class="stat-label">SEO &<br>Freelancing</span>
            </div>
        </div>
    </div>

</body>
</html>
